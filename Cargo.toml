[package]
name = "zip-carver"
version = "0.1.0"
edition = "2024"
description = "Carve ZIP structures from NTFS disk images and raw devices"
license = "MIT"

[dependencies]
csv = "1.3"
ctrlc = "3.4"
indicatif = "0.18"
flate2 = "1.1"
crc32fast = "1.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
